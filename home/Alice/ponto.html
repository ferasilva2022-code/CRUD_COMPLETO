<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusMap - Pontos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../Pietro/style.css">
</head>
<body data-aba="pontos">
    <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">BusMap</a>
                <div class="navbar-nav">
                    <a class="nav-link somente-admin" href="../Medina/index.html">Usuários</a>
                    <a class="nav-link" href="../Fernanda/linha.html">Linhas</a>
                    <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                    <a class="nav-link" href="../Alice/ponto.html">Pontos</a>
                    <a class="nav-link" href="../Luiz/horario.html">Horários</a>
                    <a class="nav-link" href="../Pietro/alerta.html" data-bm-link>Notificações <span class="bm-badge" data-bm-count aria-label="Carregando notificações">…</span></a>
                </div>
                <!-- o nome do usuário é preenchido pelo js/valida_sessao.js -->
                <div class="navbar-usuario">
                    <span id="usuarioLogado"></span>
                    <button type="button" class="btn btn-outline-light btn-sm" onclick="logoff()">Logoff</button>
                </div>
            </div>
        </nav>
    </header>

    <!-- mensagem de sucesso ou erro: fica fora do card para o usuário comum também ver -->
    <div class="container mt-4">
        <p id="mensagem" class="d-none" role="status" aria-live="polite"></p>
    </div>

    <!-- Formulário (somente-admin: escondido para usuário comum) -->
    <div class="container my-5 somente-admin">
        <div class="card shadow-sm p-4">
            <h2 class="card-title mb-4" id="titulo-form">Cadastrar Ponto</h2>
            <form id="FormPonto">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="id" class="form-label">ID do ponto</label>
                        <input type="number" id="id" class="form-control" min="1" step="1" placeholder="Ex: 101" required>
                    </div>
                    <div class="col-md-8">
                        <label for="nome" class="form-label">Nome do ponto</label>
                        <input type="text" id="nome" class="form-control" maxlength="100" placeholder="Ex: Terminal Central" required>
                    </div>
                    <div class="col-md-4">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select id="tipo" class="form-select" required>
                            <option value="terminal">Terminal</option>
                            <option value="praca">Praça</option>
                            <option value="ponto">Ponto comum</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="latitude" class="form-label">Latitude</label>
                        <input type="number" id="latitude" class="form-control" min="-90" max="90" step="any" placeholder="Ex: -25.4284" required>
                    </div>
                    <div class="col-md-4">
                        <label for="longitude" class="form-label">Longitude</label>
                        <input type="number" id="longitude" class="form-control" min="-180" max="180" step="any" placeholder="Ex: -49.2733" required>
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" id="btn_salvar" class="btn btn-primary px-4">Cadastrar</button>
                    <!-- só aparece no modo alteração -->
                    <button type="button" id="btn_alterar" class="btn btn-primary px-4 d-none">Salvar Alteração</button>
                    <button type="button" id="btn_limpar" class="btn btn-secondary px-4">Limpar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela -->
    <div class="container mb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="m-0">Pontos Cadastrados</h2>
            <div class="input-group busca">
                <input type="search" id="busca" class="form-control" placeholder="Buscar por nome ou tipo" aria-label="Buscar por nome ou tipo">
                <button type="button" id="btn_buscar" class="btn btn-outline-secondary" aria-label="Buscar"><i class="bi bi-search"></i></button>
                <button type="button" id="btn_todos" class="btn btn-outline-secondary">Todos</button>
            </div>
        </div>
        <!-- a tabela é montada pelo mostrarPontos() do script.js -->
        <div id="Pontos" class="table-responsive" aria-live="polite"></div>
        <section id="detalhes" class="card shadow-sm p-4 mt-3" hidden aria-live="polite"></section>
    </div>

    <!-- login, Logoff e permissões (admin / usuário comum) -->
    <script src="../../js/valida_sessao.js"></script>
    <script src="script.js"></script>
    <script src="../../js/Pietro/alerta_core.js"></script>
    <script src="../../js/Pietro/alerta_compartilhado.js"></script>
</body>
</html>
