<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ponto </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="stylesheet" href="../Pietro/style.css">
</head>

<body data-aba="pontos">
     <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">BusMap</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="../Medina/index.html">Usuários</a>
                    <a class="nav-link" href="../Fernanda/linha.html">Linhas</a>
                    <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                    <a class="nav-link" href="ponto.html">Pontos</a>
                    <a class="nav-link" href="../Luiz/horario.html">Horários</a>
                
                    <a class="nav-link" href="../Pietro/alerta.html" data-bm-link>Notificações <span class="bm-badge" data-bm-count aria-label="Carregando notificações">…</span></a>
                </div>
            </div>
        </nav>
    </header>
    <main class="container pb-5">
        <h2>Cadastro de ponto de ônibus</h2>
        <form id="FormPonto">
            <label for="id">ID do ponto:</label>
            <input type="number" id="id" min="1" step="1" required>

            <label for="nome">Nome do ponto:</label>
            <input type="text" id="nome" maxlength="100" required>

            <label for="tipo">Tipo:</label>
            <select id="tipo" required>
                <option value="terminal">Terminal</option>
                <option value="praca">Praça</option>
                <option value="ponto">Ponto comum</option>
            </select>

            <label for="latitude">Latitude:</label>
            <input type="number" id="latitude" min="-90" max="90" step="any" required>

            <label for="longitude">Longitude:</label>
            <input type="number" id="longitude" min="-180" max="180" step="any" required>

            <button type="submit" id="btn_salvar">Salvar ponto</button>
            <button type="button" id="btn_alterar" disabled>Alterar ponto</button>
            <button type="button" id="btn_limpar">Limpar</button>
            <p id="mensagem" role="status" aria-live="polite"></p>
        </form>

        <h2>Pontos cadastrados</h2>
        <div class="busca-pontos">
            <label for="busca">Buscar por nome ou tipo:</label>
            <input id="busca" type="search" placeholder="Ex.: Terminal">
            <button type="button" id="btn_buscar">Buscar</button>
            <button type="button" id="btn_todos">Mostrar todos</button>
        </div>
        <div id="Pontos" aria-live="polite"></div>
        <section id="detalhes" hidden aria-live="polite"></section>
    </main>
    <script src="script.js"> </script>
    <script src="../../js/Pietro/alerta_core.js"></script>
    <script src="../../js/Pietro/alerta_compartilhado.js"></script>
</body>
</html>
