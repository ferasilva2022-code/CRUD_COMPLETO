<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusMap - Horários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../Pietro/style.css">
</head>
<body data-aba="horarios">
    <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">BusMap</a>
                <div class="navbar-nav">
                    <a class="nav-link somente-admin" href="../Medina/index.html">Usuários</a>
                    <a class="nav-link" href="../Fernanda/linha.html">Linhas</a>
                    <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                    <a class="nav-link" href="../Alice/ponto.html">Pontos</a>
                    <a class="nav-link" href="../Luiz/horario.html">Horários</a>
                    <a class="nav-link" href="../Pietro/alerta.html" data-bm-link>Notificações <span class="bm-badge" data-bm-count aria-label="Carregando notificações">…</span></a>
                </div>
                <!-- o nome do usuário é preenchido pelo js/valida_sessao.js -->
                <div class="navbar-usuario">
                    <span id="usuarioLogado"></span>
                    <button type="button" class="btn btn-outline-light btn-sm" onclick="logoff()">Logoff</button>
                </div>
            </div>
        </nav>
    </header>

    <!-- mensagem de sucesso ou erro: fica fora do card para o usuário comum também ver -->
    <div class="container mt-4">
        <div id="mensagemHorarios" class="d-none" role="status" aria-live="polite"></div>
    </div>

    <!-- Formulário (somente-admin: escondido para usuário comum) -->
    <div class="container my-5 somente-admin">
        <div class="card shadow-sm p-4">
            <h2 class="card-title mb-4" id="titulo-form">Cadastrar Horário</h2>
            <form id="formHorarios">
                <!-- vazio = cadastrando; com número = alterando esse horário -->
                <input type="hidden" id="id">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="codigoLinha" class="form-label">Código da Linha</label>
                        <input type="text" id="codigoLinha" class="form-control" maxlength="3" placeholder="Ex: 030" required>
                    </div>
                    <div class="col-md-4">
                        <label for="numeroPonto" class="form-label">Número do Ponto</label>
                        <input type="number" id="numeroPonto" class="form-control" min="1" placeholder="Ex: 1" required>
                    </div>
                    <div class="col-md-4">
                        <label for="hora" class="form-label">Horário</label>
                        <input type="time" id="hora" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="dia" class="form-label">Dia</label>
                        <select id="dia" class="form-select" required>
                            <option value="">Selecione</option>
                            <option value="dia_util">Dia útil</option>
                            <option value="sabado">Sábado</option>
                            <option value="domingo">Domingo</option>
                            <option value="feriado">Feriado</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="tabela" class="form-label">Tabela</label>
                        <input type="number" id="tabela" class="form-control" min="1" placeholder="Ex: 1" required>
                    </div>
                    <div class="col-md-4">
                        <label for="adaptacao" class="form-label">Adaptação</label>
                        <input type="text" id="adaptacao" class="form-control" maxlength="100" placeholder="Ex: Rampa de acesso">
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" id="botaoSalvar" class="btn btn-primary px-4">Cadastrar</button>
                    <!-- só aparece no modo alteração -->
                    <button type="button" id="botaoCancelar" class="btn btn-secondary px-4 d-none" onclick="cancelarEdicao()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela -->
    <div class="container mb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="m-0">Horários Cadastrados</h2>
            <div class="input-group busca">
                <input type="search" id="buscaHorarios" class="form-control" maxlength="50" placeholder="Buscar linha, ponto ou dia" aria-label="Buscar linha, ponto ou dia">
                <button type="button" id="botaoBuscar" class="btn btn-outline-secondary" aria-label="Buscar"><i class="bi bi-search"></i></button>
                <button type="button" id="limparBusca" class="btn btn-outline-secondary">Limpar</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Linha</th>
                        <th>Ponto</th>
                        <th>Hora</th>
                        <th>Dia</th>
                        <th>Tabela</th>
                        <th>Adaptação</th>
                        <th class="somente-admin">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaHorarios"></tbody>
            </table>
        </div>
    </div>

    <!-- login, Logoff e permissões (admin / usuário comum) -->
    <script src="../../js/valida_sessao.js"></script>
    <script src="horario.js"></script>
    <script src="../../js/Pietro/alerta_core.js"></script>
    <script src="../../js/Pietro/alerta_compartilhado.js"></script>
</body>
</html>
