<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários - BusMap</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../Pietro/style.css">
</head>
<body data-aba="horarios">
    <!-- Barra de navegação -->
    <nav class="navbar navbar-expand">
        <div class="container">

            <a class="navbar-brand" href="../../index.html">
                BusMap
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="../Medina/index.html">Usuários</a>
                <a class="nav-link" href="../Fernanda/linha.html">Linhas</a>
                <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                <a class="nav-link" href="../Alice/ponto.html">Pontos</a>
                <a class="nav-link" href="horario.html">Horários</a>
                <a class="nav-link"
                   href="../Pietro/alerta.html"
                   data-bm-link>
                    Notificações
                    <span class="bm-badge" data-bm-count>…</span>
                </a>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <h1 class="mb-4">Horários</h1>
        <!-- Mensagem de sucesso ou erro -->
        <div id="mensagemHorarios"
             class="d-none"
             role="status"
             aria-live="polite">
        </div>
        <!-- Formulário de cadastro -->
        <div class="card shadow-sm p-4 mb-5">
            <h2 class="mb-4">Cadastro de Horários</h2>
            <form id="formHorarios">
                <input type="hidden" id="id">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            Código da Linha
                        </label>
                        <input type="text"
                               id="codigoLinha"
                               maxlength="3"
                               class="form-control"
                               required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">
                            Número do Ponto
                        </label>
                        <input type="number"
                               id="numeroPonto"
                               min="1"
                               class="form-control"
                               required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Horário</label>
                        <input type="time"
                               id="hora"
                               class="form-control"
                               required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Dia</label>
                        <select id="dia"
                                class="form-select"
                                required>
                            <option value="">Selecione</option>
                            <option value="dia_util">Dia útil</option>
                            <option value="sabado">Sábado</option>
                            <option value="domingo">Domingo</option>
                            <option value="feriado">Feriado</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tabela</label>
                        <input type="number"
                               id="tabela"
                               min="1"
                               class="form-control"
                               required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Adaptação</label>

                        <input type="text"
                               id="adaptacao"
                               maxlength="100"
                               class="form-control">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit"
                            id="botaoSalvar"
                            class="btn btn-primary px-4">
                        Salvar
                    </button>
                    <button type="button"
                            class="btn btn-secondary px-4"
                            onclick="cancelarEdicao()">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
        <!-- Listagem dos horários -->
        <section>

            <h2 class="mb-3">Horários Cadastrados</h2>

            <!-- Pesquisa -->
            <div class="d-flex flex-wrap gap-2 mb-3">

                <input type="search"
                       id="buscaHorarios"
                       maxlength="50"
                       class="form-control"
                       style="max-width: 280px;"
                       placeholder="Buscar linha, ponto ou dia">

                <button type="button"
                        id="botaoBuscar"
                        class="btn btn-primary">
                    Buscar
                </button>

                <button type="button"
                        id="limparBusca"
                        class="btn btn-outline-secondary">
                    Limpar
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Linha</th>
                            <th>Ponto</th>
                            <th>Hora</th>
                            <th>Dia</th>
                            <th>Tabela</th>
                            <th>Adaptação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaHorarios"></tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- JavaScript do CRUD -->
    <script src="horario.js"></script>
    <!-- Notificações do grupo -->
    <script src="../../js/Pietro/alerta_core.js"></script>
    <script src="../../js/Pietro/alerta_compartilhado.js"></script>
</body>
</html>
