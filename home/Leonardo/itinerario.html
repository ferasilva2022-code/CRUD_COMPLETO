<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Itinerários - BusMap</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS geral do BusMap -->
    <link rel="stylesheet" href="../../style.css">

    <!-- CSS específico -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../Pietro/style.css">
</head>

<body data-aba="itinerarios">

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">BusMap</a>
                <div class="navbar-nav">
                    <a class="nav-link somente-admin" href="../Medina/index.html">Usuários</a>
                    <a class="nav-link" href="../Fernanda/linha.html">Linhas</a>
                    <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                    <a class="nav-link" href="../Alice/ponto.html">Pontos</a>
                    <a class="nav-link" href="../Luiz/horario.html">Horários</a>
                    <a class="nav-link" href="../Pietro/alerta.html" data-bm-link>Notificações <span class="bm-badge" data-bm-count aria-label="Carregando notificações">…</span></a>
                </div>
                <!-- o nome do usuário é preenchido pelo js/valida_sessao.js -->
                <div class="navbar-usuario">
                    <span id="usuarioLogado"></span>
                    <button type="button" class="btn btn-outline-light btn-sm" onclick="logoff()">Logoff</button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo -->
    <main class="container my-5">

        <h1 class="mb-4">Itinerários</h1>

        <!-- Cadastro (somente-admin: escondido para usuário comum) -->
        <div class="card shadow-sm p-4 mb-5 somente-admin">

            <h2 class="mb-4">Cadastrar Itinerário</h2>

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="codigoLinha" class="form-label">Código da Linha</label>
                    <input type="text" id="codigoLinha" maxlength="10" placeholder="Ex: 030" class="form-control">
                </div>

                <div class="col-md-6">
                    <label for="sentido" class="form-label">Sentido</label>
                    <input type="text" id="sentido" maxlength="100" placeholder="Ex: Centro - Bairro Novo" class="form-control">
                </div>

                <div class="col-md-6">
                    <label for="ativo" class="form-label">Situação</label>
                    <select id="ativo" class="form-select">
                        <option value="true">Ativo</option>
                        <option value="false">Inativo</option>
                    </select>
                </div>

            </div>

            <div class="mt-4">
                <button type="button" id="btnAdicionar" class="btn btn-primary px-4">Adicionar</button>

                <button type="button" id="btnSalvar" class="btn btn-primary px-4" style="display:none;"">
                    Salvar Alteração
                </button>

                <span id="msgForm" class="ms-3"></span>
            </div>

        </div>

        <!-- Listagem -->
        <section>
            <h2 class="mb-3">Itinerários Cadastrados</h2>

            <div class="table-responsive">
                <div id="listaItinerarios"></div>
            </div>
        </section>

    </main>

    <!-- login, Logoff e permissões (admin / usuário comum) -->
    <script src="../../js/valida_sessao.js"></script>
    <script src="itinerario.js"></script>
    <script src="../../js/Pietro/alerta_core.js"></script>
    <script src="../../js/Pietro/alerta_compartilhado.js"></script>

</body>

</html>
