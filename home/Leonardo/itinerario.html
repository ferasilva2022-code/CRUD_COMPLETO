<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusMap - Itinerários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../Pietro/style.css">
</head>
<body data-aba="itinerarios">
    <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">BusMap</a>
                <div class="navbar-nav">
                    <a class="nav-link somente-admin" href="../Medina/index.html">Usuários</a>
                    <a class="nav-link" href="../Fernanda/linha.html">Linhas</a>
                    <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                    <a class="nav-link" href="../Alice/ponto.html">Pontos</a>
                    <a class="nav-link" href="../Luiz/horario.html">Horários</a>
                    <a class="nav-link" href="../Pietro/alerta.html" data-bm-link>Notificações <span class="bm-badge" data-bm-count aria-label="Carregando notificações">…</span></a>
                </div>
                <!-- o nome do usuário é preenchido pelo js/valida_sessao.js -->
                <div class="navbar-usuario">
                    <span id="usuarioLogado"></span>
                    <button type="button" class="btn btn-outline-light btn-sm" onclick="logoff()">Logoff</button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Formulário (somente-admin: escondido para usuário comum) -->
    <div class="container my-5 somente-admin">
        <div class="card shadow-sm p-4">
            <h2 class="card-title mb-4" id="titulo-form">Cadastrar Itinerário</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="codigoLinha" class="form-label">Código da Linha</label>
                    <input type="text" id="codigoLinha" class="form-control" maxlength="10" placeholder="Ex: 030">
                </div>
                <div class="col-md-8">
                    <label for="sentido" class="form-label">Sentido</label>
                    <input type="text" id="sentido" class="form-control" maxlength="100" placeholder="Ex: Centro - Bairro Novo">
                </div>
                <div class="col-md-4">
                    <label for="ativo" class="form-label">Situação</label>
                    <select id="ativo" class="form-select">
                        <option value="true">Ativo</option>
                        <option value="false">Inativo</option>
                    </select>
                </div>
            </div>
            <div class="mt-4 d-flex flex-wrap align-items-center gap-2">
                <button type="button" id="btnAdicionar" class="btn btn-primary px-4">Cadastrar</button>
                <!-- só aparecem no modo alteração; o link sem parâmetros volta pro cadastro -->
                <button type="button" id="btnSalvar" class="btn btn-primary px-4 d-none">Salvar Alteração</button>
                <a id="btnCancelar" href="itinerario.html" class="btn btn-secondary px-4 d-none">Cancelar</a>
                <span id="msgForm" class="ms-2"></span>
            </div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="container mb-5">
        <h2 class="mb-3">Itinerários Cadastrados</h2>
        <!-- a tabela é montada pelo carregaRegistros() do itinerario.js -->
        <div id="listaItinerarios" class="table-responsive"></div>
    </div>

    <!-- login, Logoff e permissões (admin / usuário comum) -->
    <script src="../../js/valida_sessao.js"></script>
    <script src="itinerario.js"></script>
    <script src="../../js/Pietro/alerta_core.js"></script>
    <script src="../../js/Pietro/alerta_compartilhado.js"></script>
</body>
</html>
