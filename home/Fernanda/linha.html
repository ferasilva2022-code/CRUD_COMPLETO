<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUSMAP|LINHAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="css/linha.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">BusMap</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="../Medina/index.html">Usuários</a>
                    <a class="nav-link" href="linha.html">Linhas</a>
                    <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                    <a class="nav-link" href="../Alice/ponto.html">Pontos</a>
                    <a class="nav-link" href="../Luiz/horario.html">Horários</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Formulário no modelo Card -->
    <div class="container my-5">
        <div class="card shadow-sm p-4">
            <h2 class="card-title mb-4">Cadastrar Linha</h2>
            <form id="formularioCadastroLinha">
                <div class="row g-3">
                    <!-- Nome da Linha -->
                    <div class="col-md-8">
                        <label for="nomeLinha" class="form-label">Nome da Linha</label>
                        <input type="text" class="form-control" id="nomeLinha" name="nomeLinha" placeholder="Ex: Atuba/Pinheirinho" required>
                        <span class="msg-erro" id="erro-nomeLinha"></span>
                    </div>

                    <!-- ID da Linha -->
                    <div class="col-md-4">
                        <label for="idLinha" class="form-label">ID da Linha</label>
                        <input type="text" class="form-control" id="idLinha" name="idLinha" placeholder="Ex: 350" required>
                        <span class="msg-erro" id="erro-idLinha"></span>
                    </div>

                    <!-- Forma pagamento da Linha -->
                    <div class="col-md-4">
                        <label for="formaPagamento" class="form-label">Forma de pagamento aceita</label>
                        <input type="text" class="form-control" id="formaPagamento" name="formaPagamento" placeholder="Ex: Cartão" required>
                        <span class="msg-erro" id="erro-formaPagamento"></span>
                    </div>

                    <!-- Valor da tarifa -->
                    <div class="col-md-4">
                        <label for="valorTarifa" class="form-label">Valor da tarifa</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="valorTarifa" name="valorTarifa" placeholder="Ex: 3.50" required>
                        <span class="msg-erro" id="erro-valorTarifa"></span>
                    </div>

                    <!-- Status -->
                    <div class="col-12 mt-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="statusLinha" name="statusLinha" checked>
                            <label class="form-check-label" for="statusLinha" id="labelStatus">Ativa</label>
                        </div>
                    </div>

                    
                </div>

                <div id="botoes" class="mt-4">
                    <button type="submit" id="btnCadastrarLinha" class="btn btn-primary px-4">Cadastrar</button>
                </div>
                <div id="alterar"></div>
            </form>
        </div>
    </div>

    <!-- Tabela -->
    <div class="container mb-5">
        <h2 class="mb-3">Linhas Cadastradas</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle" id="containerCards">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NOME</th>
                        <th>FORMA DE PAGAMENTO ACEITA</th>
                        <th>STATUS</th>
                        <th>VALOR DA TARIFA</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="linhacards"></tbody>
            </table>
        </div>
    </div>

    <script src="../../js/Fernanda/alterar_linha.js"></script>
    <script src="../../js/Fernanda/excluir_linha.js"></script>
    <script src="linha.js"></script>
</body>
</html>
