<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusMap - Alterar usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<!-- data-somente-admin: usuário comum que abrir esta página volta para Linhas -->
<body data-somente-admin>
    <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">BusMap</a>
                <div class="navbar-nav">
                    <a class="nav-link somente-admin" href="../Medina/index.html">Usuários</a>
                    <a class="nav-link" href="../Fernanda/linha.html">Linhas</a>
                    <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                    <a class="nav-link" href="../Alice/ponto.html">Pontos</a>
                    <a class="nav-link" href="../Luiz/horario.html">Horários</a>
                </div>
                <!-- o nome do usuário é preenchido pelo js/valida_sessao.js -->
                <div class="navbar-usuario">
                    <span id="usuarioLogado"></span>
                    <button type="button" class="btn btn-outline-light btn-sm" onclick="logoff()">Logoff</button>
                </div>
            </div>
        </nav>
    </header>

<div class="container my-5">
    <div class="card shadow-sm p-4">
        <h2 class="card-title mb-4">Alterar usuário</h2>
        <!-- o id vem da URL (usuario_alterar.html?id=3) e fica guardado aqui -->
        <input type="hidden" id="id">
        <div class="row g-3">
            <div class="col-md-8">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" id="nome" class="form-control" maxlength="100">
            </div>
            <div class="col-md-4">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" id="telefone" class="form-control" maxlength="14">
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" maxlength="200">
            </div>
            <div class="col-md-6">
                <label for="senha" class="form-label">Nova senha</label>
                <input type="password" id="senha" class="form-control">
                <div class="form-text">Deixe em branco para manter a senha atual.</div>
            </div>
            <div class="col-md-6">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" class="form-select">
                    <option value="usuario">Usuário</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="button" id="enviar" class="btn btn-primary px-4">Salvar</button>
            <a href="index.html" class="btn btn-secondary px-4">Voltar</a>
        </div>
    </div>
</div>
<script src="../../js/valida_sessao.js"></script>
<script src="../../js/Medina/alterar_usuario.js"></script>
</body>
</html>
