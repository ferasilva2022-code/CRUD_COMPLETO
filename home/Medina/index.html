<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand">
        <div class="container">
            <a class="navbar-brand" href="../../index.html">BusMap</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Usuários</a>
                <a class="nav-link" href="../Fernanda/linha.html">Linhas</a>
                <a class="nav-link" href="../Leonardo/itinerario.html">Itinerários</a>
                <a class="nav-link" href="../Alice/ponto.html">Pontos</a>
                <a class="nav-link" href="../Luiz/horario.html">Horários</a>
            </div>
        </div>
    </nav>
<div class="container my-5">
    <div class="card shadow-sm p-4">
        <h2 class="card-title mb-4">Cadastrar usuário</h2>
        <div class="row g-3">
            <!-- Nome -->
            <div class="col-md-8">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" name="nome" id="nome" class="form-control">
            </div>
            <!-- Idade -->
            <div class="col-md-4">
                <label for="idade" class="form-label">Idade</label>
                <input type="number" name="idade" id="idade" class="form-control">
            </div>
            <!-- Email -->
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control">
            </div>
            <!-- Senha -->
            <div class="col-md-6">
                <label for="senha" class="form-label">Senha</label>

                <div class="input-group">
                    <input type="password" name="senha" id="senha" class="form-control">
                    <button class="btn btn-outline-secondary" type="button" id="mostrar-senha"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <!-- Cargo -->
            <div class="col-md-6">
                <label for="cargo" class="form-label">Cargo</label>
                <select name="cargo" id="cargo" class="form-select">
                    <option value="cliente">Cliente</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
        </div>
        <div id="botoes" class="mt-4">
            <button type="button" id="adicionar-btn" class="btn btn-primary px-4">Adicionar</button>
        </div>

    </div>
</div>
<div class="container mb-5">
    <h2 class="mb-3">Usuarios Cadastrados</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Email</th>
                    <th>Cargo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-usuarios">
            </tbody>
        </table>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
