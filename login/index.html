<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUSMAP|LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../index.html">BusMap</a>
            </div>
        </nav>
    </header>

    <div class="container my-5" style="max-width: 420px;">
        <div class="card shadow-sm p-4">
            <h2 class="card-title mb-2">Seja bem vindo!</h2>
            <p class="text-secondary">Entre com seu email e senha para acessar o sistema.</p>
            <hr>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" id="email">
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha">
                <p class="small mt-2 mb-0">Novo por aqui? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
            <div>
                <button id="enviar" class="btn btn-busmap w-100">Entrar</button>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
