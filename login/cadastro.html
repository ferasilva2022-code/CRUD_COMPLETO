<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUSMAP|CADASTRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="../index.html">BusMap</a>
            </div>
        </nav>
    </header>

    <!-- Cadastro de novo usuário (sempre entra como usuário comum) -->
    <div class="container my-5" style="max-width: 420px;">
        <div class="card shadow-sm p-4">
            <h2 class="card-title mb-2">Cadastre-se</h2>
            <p class="text-secondary">Crie sua conta para visualizar as informações do sistema.</p>
            <hr>
            <div class="mb-3">
                <label for="cadNome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="cadNome">
            </div>
            <div class="mb-3">
                <label for="cadEmail" class="form-label">Email</label>
                <input type="text" class="form-control" id="cadEmail">
            </div>
            <div class="mb-3">
                <label for="cadSenha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="cadSenha">
            </div>
            <div class="mb-3">
                <label for="cadTipo" class="form-label">Tipo</label>
                <select class="form-select" id="cadTipo">
                    <option value="usuario">Usuário</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="cadTelefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="cadTelefone" placeholder="(41)99999-9999" maxlength="14">
            </div>
            <div>
                <button id="cadastrar" class="btn btn-busmap w-100">Cadastrar</button>
            </div>
            <p class="small mt-3 mb-0 text-center">Já tem conta? <a href="index.html">Entrar</a></p>
        </div>
    </div>

    <script src="../js/cadastro.js"></script>
</body>
</html>
